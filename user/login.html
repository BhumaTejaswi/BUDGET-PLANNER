<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User login | Budget Planner</title>
  <meta name="description" content="Log in to your Budget Planner account." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="login.css" />
</head>
<body>
  <div class="layout">

    <!-- Left: brand panel with the coin jar -->
    <aside class="panel">
      <div class="brand-block">
        <a class="brand" href="../role.html" aria-label="Budget Planner, back to role selection">
          <span class="brand-mark" aria-hidden="true">₹</span>
          <span class="brand-name">Budget Planner</span>
        </a>
        <p class="brand-sub">Your money. Your plan.</p>
      </div>

      <h2 class="panel-line">Small steps today, bigger dreams tomorrow.</h2>

      <!-- Decorative jar. Coins drop in as the form is completed. -->
      <svg class="jar" viewBox="0 0 240 320" aria-hidden="true">
        <defs>
          <radialGradient id="glow" cx="50%" cy="60%" r="55%">
            <stop offset="0%" stop-color="#cdeb8b" stop-opacity="0.28" />
            <stop offset="100%" stop-color="#cdeb8b" stop-opacity="0" />
          </radialGradient>
        </defs>

        <circle cx="120" cy="190" r="150" fill="url(#glow)" />

        <!-- Sprout: grows when login succeeds -->
        <g class="sprout">
          <path class="stem" d="M122 180C122 140 120 100 124 58" />
          <path class="leaf leaf-a" d="M122 112C96 112 78 96 74 74c24-2 46 12 48 38Z" />
          <path class="leaf leaf-b" d="M124 82c2-24 22-42 50-42 0 26-18 42-50 42Z" />
          <path class="leaf leaf-c" d="M124 62c-12-10-14-26-6-40 16 8 20 24 6 40Z" />
        </g>

        <!-- Glass -->
        <path class="glass" d="M78 104C78 130 44 140 44 178V272Q44 292 64 292H176Q196 292 196 272V178C196 140 162 130 162 104Z" />
        <rect class="rim" x="70" y="92" width="100" height="14" rx="7" />

        <!-- Coins: row 1 on load, row 2 when the email is valid, row 3 when a password is typed -->
        <g class="coin" data-row="1" style="--d:0"><circle cx="84" cy="268" r="19" class="coin-face" /><circle cx="84" cy="268" r="14" class="coin-ring" /><text x="84" y="269" class="coin-mark">₹</text></g>
        <g class="coin" data-row="1" style="--d:1"><circle cx="122" cy="268" r="19" class="coin-face" /><circle cx="122" cy="268" r="14" class="coin-ring" /><text x="122" y="269" class="coin-mark">₹</text></g>
        <g class="coin" data-row="1" style="--d:2"><circle cx="160" cy="268" r="19" class="coin-face" /><circle cx="160" cy="268" r="14" class="coin-ring" /><text x="160" y="269" class="coin-mark">₹</text></g>

        <g class="coin" data-row="2" style="--d:0"><circle cx="103" cy="232" r="19" class="coin-face" /><circle cx="103" cy="232" r="14" class="coin-ring" /><text x="103" y="233" class="coin-mark">₹</text></g>
        <g class="coin" data-row="2" style="--d:1"><circle cx="141" cy="232" r="19" class="coin-face" /><circle cx="141" cy="232" r="14" class="coin-ring" /><text x="141" y="233" class="coin-mark">₹</text></g>

        <g class="coin" data-row="3" style="--d:0"><circle cx="122" cy="196" r="19" class="coin-face" /><circle cx="122" cy="196" r="14" class="coin-ring" /><text x="122" y="197" class="coin-mark">₹</text></g>

        <path class="shine" d="M62 150C58 170 58 230 62 262" />
      </svg>
    </aside>

    <!-- Right: form -->
    <main class="form-side">
      <a class="back" href="../role.html">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6" /></svg>
        Back to role selection
      </a>

      <section class="card">
        <div class="badge" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="34" height="34" fill="currentColor">
            <circle cx="12" cy="8" r="4.2" />
            <path d="M3.8 21c0-4.4 3.7-7.2 8.2-7.2s8.2 2.8 8.2 7.2c0 .6-.4 1-1 1H4.8c-.6 0-1-.4-1-1Z" />
          </svg>
        </div>

        <h1 id="title">User Login</h1>
        <p class="sub" id="subtitle">Sign in to continue to your budget.</p>

        <!-- LOGIN -->
        <form id="loginForm" novalidate>
          <div class="field">
            <label for="email">Email Address</label>
            <div class="control">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5" /><path d="m4 7 8 6 8-6" /></svg>
              <input id="email" name="email" type="email" inputmode="email" autocomplete="username" placeholder="Enter your email" aria-describedby="emailError" />
            </div>
            <p class="error" id="emailError" hidden></p>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <div class="control">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2.5" /><path d="M8 11V7.5a4 4 0 0 1 8 0V11" /></svg>
              <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" aria-describedby="passwordError" />
              <button class="toggle" id="toggle" type="button" aria-label="Show password" aria-pressed="false">Show</button>
            </div>
            <p class="error" id="passwordError" hidden></p>
          </div>

          <div class="row">
            <label class="remember">
              <input type="checkbox" id="remember" />
              <span>Keep me logged in</span>
            </label>
            <a class="link" href="#" id="forgot">Forgot password?</a>
          </div>

          <p class="form-error" id="formError" role="alert" hidden></p>

          <button class="submit" id="submit" type="submit">
            <span class="submit-label">Login</span>
          </button>
        </form>

        <!-- SIGN UP -->
        <form id="signupForm" novalidate hidden>
          <div class="field">
            <label for="sName">Full Name</label>
            <div class="control">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4" /><path d="M4.5 20.5c0-4 3.4-6.5 7.5-6.5s7.5 2.5 7.5 6.5" /></svg>
              <input id="sName" name="name" type="text" autocomplete="name" placeholder="Enter your full name" aria-describedby="sNameError" />
            </div>
            <p class="error" id="sNameError" hidden></p>
          </div>
          <div class="field">
            <label for="sEmail">Email Address</label>
            <div class="control">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5" /><path d="m4 7 8 6 8-6" /></svg>
              <input id="sEmail" name="email" type="email" inputmode="email" autocomplete="email" placeholder="Enter your email" aria-describedby="sEmailError" />
            </div>
            <p class="error" id="sEmailError" hidden></p>
          </div>
          <div class="field">
            <label for="sPassword">Password</label>
            <div class="control">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2.5" /><path d="M8 11V7.5a4 4 0 0 1 8 0V11" /></svg>
              <input id="sPassword" name="password" type="password" autocomplete="new-password" placeholder="Create a password" aria-describedby="sPasswordHelp sPasswordError" />
              <button class="toggle" id="sToggle" type="button" aria-label="Show password" aria-pressed="false">Show</button>
            </div>
            <p class="help" id="sPasswordHelp">At least 8 characters, with a letter and a number.</p>
            <p class="error" id="sPasswordError" hidden></p>
          </div>
          <div class="field">
            <label for="sConfirm">Confirm Password</label>
            <div class="control">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2.5" /><path d="M8 11V7.5a4 4 0 0 1 8 0V11" /></svg>
              <input id="sConfirm" name="confirm" type="password" autocomplete="new-password" placeholder="Re-enter your password" aria-describedby="sConfirmError" />
            </div>
            <p class="error" id="sConfirmError" hidden></p>
          </div>

          <p class="form-error" id="signupError" role="alert" hidden></p>

          <button class="submit" id="sSubmit" type="submit">
            <span class="submit-label">Create account</span>
          </button>
        </form>

        <p class="alt" id="altLogin">Don't have an account? <a class="link" href="#signup" id="toSignup">Sign up</a></p>
        <p class="alt" id="altSignup" hidden>Already have an account? <a class="link" href="#login" id="toLogin">Log in</a></p>
      </section>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="../auth.js"></script>
  <script src="login.js"></script>
</body>
</html>
